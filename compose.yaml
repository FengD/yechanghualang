services:
  gallery:
    build: .
    image: night-gallery:local
    ports:
      - "${GALLERY_BIND:-0.0.0.0}:${GALLERY_PORT:-8080}:8080"
    environment:
      ROOM_CREATE_KEY: ${ROOM_CREATE_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - room-data:/data
    init: true
    read_only: true
    restart: unless-stopped

volumes:
  room-data:
